<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="513px" preserveAspectRatio="none" style="width:902px;height:513px;background:#FFFFFF;" version="1.1" viewBox="0 0 902 513" width="902px" zoomAndPan="magnify"><?plantuml 1.2026.6?><defs/><g><g class="title" data-source-line="1"><text fill="#111827" font-family="Helvetica" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="375.6963" x="259.8223" y="20.7803">Command-buffer packing at the flagship attention shape</text></g><!--cluster rule--><g class="cluster" data-qualified-name="rule" data-source-line="16" id="ent0001"><rect fill="#DBEAFE" height="440" rx="5" ry="5" style="stroke:#4B5563;stroke-width:1;" width="764" x="65.6704" y="42"/><text fill="#111827" font-family="Helvetica" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="551.6328" x="171.854" y="54.7803">MLX 0.32.0 commit rule on applegpu_g13s, checked after each evaluated primitive:</text><text fill="#111827" font-family="Helvetica" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="347.3955" x="273.9727" y="68.7803">commit when ops &gt; 50 or floor(elements / 2^20) &gt; 50</text></g><!--cluster laneA--><g class="cluster" data-qualified-name="rule.laneA" data-source-line="18" id="ent0002"><rect fill="#F8FAFC" height="155" rx="5" ry="5" style="stroke:#4B5563;stroke-width:1;" width="700" x="97.6704" y="105"/><text fill="#111827" font-family="Helvetica" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="276.2061" x="309.5674" y="117.7803">Large backward dispatches (dK/dV class)</text></g><!--cluster laneB--><g class="cluster" data-qualified-name="rule.laneB" data-source-line="23" id="ent0005"><rect fill="#F8FAFC" height="141" rx="5" ry="5" style="stroke:#4B5563;stroke-width:1;" width="518" x="279.6704" y="309"/><text fill="#111827" font-family="Helvetica" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="420.875" x="328.2329" y="321.7803">Small forward dispatches (scalar class, row-contiguous inputs)</text></g><!--entity a1--><g class="entity" data-qualified-name="rule.laneA.a1" data-source-line="19" id="ent0003"><rect fill="#FECACA" height="90" rx="5" ry="5" style="stroke:#4B5563;stroke-width:0.5;" width="246.4883" x="121.4304" y="146"/><text fill="#111827" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="104.2686" x="131.4304" y="166.7803">Command buffer</text><text fill="#111827" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="171.9443" x="131.4304" y="180.7803">possible smaller prefix work</text><text fill="#111827" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="120.6475" x="131.4304" y="194.7803">then dK/dV range 1</text><text fill="#111827" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="226.4883" x="131.4304" y="208.7803">~118 M unique elements = 112 units</text><text fill="#111827" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="153.2754" x="131.4304" y="222.7803">over the limit at its check</text></g><!--entity a2--><g class="entity" data-qualified-name="rule.laneA.a2" data-source-line="20" id="ent0004"><rect fill="#FECACA" height="90" rx="5" ry="5" style="stroke:#4B5563;stroke-width:0.5;" width="225.4473" x="528.9504" y="146"/><text fill="#111827" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="104.2686" x="538.9504" y="166.7803">Command buffer</text><text fill="#111827" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="171.9443" x="538.9504" y="180.7803">possible smaller prefix work</text><text fill="#111827" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="120.6475" x="538.9504" y="194.7803">then dK/dV range 2</text><text fill="#111827" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="205.4473" x="538.9504" y="208.7803">counters reset, buffers recounted</text><text fill="#111827" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="138.5029" x="538.9504" y="222.7803">crosses the limit again</text></g><!--entity b1--><g class="entity" data-qualified-name="rule.laneB.b1" data-source-line="24" id="ent0006"><rect fill="#DCFCE7" height="76" rx="5" ry="5" style="stroke:#4B5563;stroke-width:0.5;" width="198.2266" x="303.5604" y="350"/><text fill="#111827" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="104.2686" x="313.5604" y="370.7803">Command buffer</text><text fill="#111827" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="178.2266" x="313.5604" y="384.7803">q k v: 48 units, counted once</text><text fill="#111827" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="177.0781" x="313.5604" y="398.7803">each range adds ~0.46 units</text><text fill="#111827" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="155.668" x="313.5604" y="412.7803">the 7th range reaches 51</text></g><!--entity b2--><g class="entity" data-qualified-name="rule.laneB.b2" data-source-line="25" id="ent0007"><rect fill="#DCFCE7" height="62" rx="5" ry="5" style="stroke:#4B5563;stroke-width:0.5;" width="139.834" x="614.7504" y="357"/><text fill="#111827" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="104.2686" x="624.7504" y="377.7803">Command buffer</text><text fill="#111827" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="108.1855" x="624.7504" y="391.7803">the next 7 ranges</text><text fill="#111827" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="119.834" x="624.7504" y="405.7803">pack the same way</text></g><!--link laneA to laneB--><!--link a1 to a2--><g class="link" data-entity-1="ent0003" data-entity-2="ent0004" data-link-type="dependency" data-source-line="30" id="lnk9"><path d="M368.3804,191 C419.5804,191 473.5604,191 523.5904,191" fill="none" id="a1-to-a2" style="stroke:#4B5563;stroke-width:1;"/><polygon fill="#4B5563" points="528.5904,191,519.5904,187,523.5904,191,519.5904,195,528.5904,191" style="stroke:#4B5563;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#374151" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="125.709" x="385.9304" y="171.0103">range triggers commit</text><text fill="#374151" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="94.6309" x="401.4695" y="184.0103">after its primitive</text></g><!--link b1 to b2--><g class="link" data-entity-1="ent0006" data-entity-2="ent0007" data-link-type="dependency" data-source-line="31" id="lnk10"><path d="M502.0904,388 C539.2004,388 575.5204,388 609.4604,388" fill="none" id="b1-to-b2" style="stroke:#4B5563;stroke-width:1;"/><polygon fill="#4B5563" points="614.4604,388,605.4604,384,609.4604,388,605.4604,392,614.4604,388" style="stroke:#4B5563;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#374151" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="71.5127" x="522.8222" y="368.0103">commit after</text><text fill="#374151" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="76.6162" x="520.2704" y="381.0103">the 7th range</text></g><g class="caption" data-source-line="33"><text fill="#111827" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="893.3408" x="1" y="501.7803">Accounting model derived from pinned MLX 0.32.0 source. Element counts are source-reported arithmetic, not a Metal command-buffer capture.</text></g><?plantuml-src hLHHJzim47xFhpZ12qYqD8LIX3IajhIQjB6NITEaTPkkyIMnSEnWEotJ1BzzvpYm09DuMPyQtztdxxxxV5vwHR0mLOLQ33PDdfE56hCRgGj03xuao1KMhfGrVtlINXeDhiIQaiHnMeqMAzXmIM5DeyN2A6DXVzN-UXbS8imkmEQe7FKYNPdLV7KwwWK4vTWelpBQVyAAu3sfBNcPuRzpkflJD3qVJtifCslDhWkUpYUJivENmLxroVGqdQHzTfHvr0Mhz3i1c1iho3u70tXzEsU-KkHyDLijalia-GkvT_tnAuo69-FX238U