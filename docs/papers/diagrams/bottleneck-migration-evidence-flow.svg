<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="971px" preserveAspectRatio="none" style="width:742px;height:971px;background:#FFFFFF;" version="1.1" viewBox="0 0 742 971" width="742px" zoomAndPan="magnify"><?plantuml 1.2026.6?><defs/><g><g class="title" data-source-line="1"><text fill="#111827" font-family="Helvetica" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="221.7031" x="256.8315" y="20.7803">Two hypotheses, two corrections</text></g><!--entity h1--><g class="entity" data-qualified-name="h1" data-source-line="16" id="ent0001"><rect fill="#DBEAFE" height="62" rx="5" ry="5" style="stroke:#4B5563;stroke-width:0.5;" width="214.4961" x="42.81" y="42"/><text fill="#111827" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="80.9307" x="52.81" y="62.7803">Hypothesis 1</text><text fill="#111827" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="194.4961" x="52.81" y="76.7803">Remove the (N, V) logits matrix</text><text fill="#111827" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="141.6338" x="52.81" y="90.7803">to train longer contexts</text></g><!--entity tie--><g class="entity" data-qualified-name="tie" data-source-line="17" id="ent0002"><rect fill="#FECACA" height="62" rx="5" ry="5" style="stroke:#4B5563;stroke-width:0.5;" width="240.2266" x="29.94" y="179"/><text fill="#111827" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="161.875" x="39.94" y="199.7803">8,192-token training result</text><text fill="#111827" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="220.2266" x="39.94" y="213.7803">Fused and stock marginal peaks tie</text><text fill="#111827" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="77.8271" x="39.94" y="227.7803">at 21.39 GiB</text></g><!--entity probe--><g class="entity" data-qualified-name="probe" data-source-line="18" id="ent0003"><rect fill="#FEF3C7" height="62" rx="5" ry="5" style="stroke:#4B5563;stroke-width:0.5;" width="286.1162" x="7" y="316"/><text fill="#111827" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="146.3301" x="17" y="336.7803">Isolated attention probe</text><text fill="#111827" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="266.1162" x="17" y="350.7803">Forward-plus-backward reaches 12.75 GiB</text><text fill="#111827" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="238.9434" x="17" y="364.7803">and grows about 3.7-3.8x per doubling</text></g><!--entity flash--><g class="entity" data-qualified-name="flash" data-source-line="19" id="ent0004"><rect fill="#DCFCE7" height="62" rx="5" ry="5" style="stroke:#4B5563;stroke-width:0.5;" width="285.3574" x="7.38" y="453"/><text fill="#111827" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="157.1992" x="17.38" y="473.7803">Implementation response</text><text fill="#111827" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="265.3574" x="17.38" y="487.7803">Tiled FlashAttention forward and backward</text><text fill="#111827" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="242.7852" x="17.38" y="501.7803">Saved attention state scales with N x D</text></g><!--entity h2--><g class="entity" data-qualified-name="h2" data-source-line="20" id="ent0005"><rect fill="#DBEAFE" height="62" rx="5" ry="5" style="stroke:#4B5563;stroke-width:0.5;" width="239.4746" x="442.32" y="453"/><text fill="#111827" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="80.9307" x="452.32" y="473.7803">Hypothesis 2</text><text fill="#111827" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="219.4746" x="452.32" y="487.7803">The projected duration of the whole</text><text fill="#111827" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="211.6816" x="452.32" y="501.7803">packed launch chain is the kill unit</text></g><!--entity packing--><g class="entity" data-qualified-name="packing" data-source-line="21" id="ent0006"><rect fill="#FECACA" height="62" rx="5" ry="5" style="stroke:#4B5563;stroke-width:0.5;" width="249.5918" x="437.26" y="590"/><text fill="#111827" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="193.7852" x="447.26" y="610.7803">MLX source and packing probe</text><text fill="#111827" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="229.5918" x="447.26" y="624.7803">Large production ranges each trigger</text><text fill="#111827" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="162.6064" x="447.26" y="638.7803">a command-buffer commit</text></g><!--entity guard--><g class="entity" data-qualified-name="guard" data-source-line="22" id="ent0007"><rect fill="#DCFCE7" height="62" rx="5" ry="5" style="stroke:#4B5563;stroke-width:0.5;" width="272.1504" x="425.98" y="727"/><text fill="#111827" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="104.2686" x="435.98" y="747.7803">Guard correction</text><text fill="#111827" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="252.1504" x="435.98" y="761.7803">Budget each command buffer separately</text><text fill="#111827" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="217.1504" x="435.98" y="775.7803">Keep the safety margin unchanged</text></g><!--entity sweep--><g class="entity" data-qualified-name="sweep" data-source-line="23" id="ent0008"><rect fill="#EDE9FE" height="76" rx="5" ry="5" style="stroke:#4B5563;stroke-width:0.5;" width="211.085" x="456.52" y="864"/><text fill="#111827" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="176.6475" x="466.52" y="884.7803">Source-reported later sweep</text><text fill="#111827" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="191.085" x="466.52" y="898.7803">23,040 tokens on flash + fused</text><text fill="#111827" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="190.6885" x="466.52" y="912.7803">7,936 tokens on the stock path</text><text fill="#111827" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="73.9102" x="466.52" y="926.7803">(mlx 0.32.0)</text></g><!--link h1 to tie--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" data-link-type="dependency" data-source-line="25" id="lnk9"><path d="M150.06,104.3 C150.06,126.53 150.06,151.59 150.06,173.8" fill="none" id="h1-to-tie" style="stroke:#4B5563;stroke-width:1;"/><polygon fill="#4B5563" points="150.06,178.8,154.06,169.8,150.06,173.8,146.06,169.8,150.06,178.8" style="stroke:#4B5563;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#374151" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="57.8081" x="151.06" y="145.0103">measured</text></g><!--link tie to probe--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" data-link-type="dependency" data-source-line="26" id="lnk10"><path d="M150.06,241.3 C150.06,263.53 150.06,288.59 150.06,310.8" fill="none" id="tie-to-probe" style="stroke:#4B5563;stroke-width:1;"/><polygon fill="#4B5563" points="150.06,315.8,154.06,306.8,150.06,310.8,146.06,306.8,150.06,315.8" style="stroke:#4B5563;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#374151" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="137.3125" x="151.06" y="282.0103">investigate shared peak</text></g><!--link probe to flash--><g class="link" data-entity-1="ent0003" data-entity-2="ent0004" data-link-type="dependency" data-source-line="27" id="lnk11"><path d="M150.06,378.3 C150.06,400.53 150.06,425.59 150.06,447.8" fill="none" id="probe-to-flash" style="stroke:#4B5563;stroke-width:1;"/><polygon fill="#4B5563" points="150.06,452.8,154.06,443.8,150.06,447.8,146.06,443.8,150.06,452.8" style="stroke:#4B5563;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#374151" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="127.207" x="151.06" y="419.0103">change the bottleneck</text></g><!--link flash to h2--><g class="link" data-entity-1="ent0004" data-entity-2="ent0005" data-link-type="dependency" data-source-line="28" id="lnk12"><path d="M293,484 C341.57,484 390.32,484 436.93,484" fill="none" id="flash-to-h2" style="stroke:#4B5563;stroke-width:1;"/><polygon fill="#4B5563" points="441.93,484,432.93,480,436.93,484,432.93,488,441.93,484" style="stroke:#4B5563;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#374151" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="113.439" x="311.03" y="477.0103">exposes a new limit</text></g><!--link h2 to packing--><g class="link" data-entity-1="ent0005" data-entity-2="ent0006" data-link-type="dependency" data-source-line="29" id="lnk13"><path d="M562.06,515.3 C562.06,537.53 562.06,562.59 562.06,584.8" fill="none" id="h2-to-packing" style="stroke:#4B5563;stroke-width:1;"/><polygon fill="#4B5563" points="562.06,589.8,566.06,580.8,562.06,584.8,558.06,580.8,562.06,589.8" style="stroke:#4B5563;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#374151" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="163.3062" x="563.06" y="556.0103">inspect submission behavior</text></g><!--link packing to guard--><g class="link" data-entity-1="ent0006" data-entity-2="ent0007" data-link-type="dependency" data-source-line="30" id="lnk14"><path d="M562.06,652.3 C562.06,674.53 562.06,699.59 562.06,721.8" fill="none" id="packing-to-guard" style="stroke:#4B5563;stroke-width:1;"/><polygon fill="#4B5563" points="562.06,726.8,566.06,717.8,562.06,721.8,558.06,717.8,562.06,726.8" style="stroke:#4B5563;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#374151" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="100.4326" x="563.06" y="693.0103">correct the model</text></g><!--link guard to sweep--><g class="link" data-entity-1="ent0007" data-entity-2="ent0008" data-link-type="dependency" data-source-line="31" id="lnk15"><path d="M562.06,789.46 C562.06,811.14 562.06,835.4 562.06,858.51" fill="none" id="guard-to-sweep" style="stroke:#4B5563;stroke-width:1;"/><polygon fill="#4B5563" points="562.06,863.51,566.06,854.51,562.06,858.51,558.06,854.51,562.06,863.51" style="stroke:#4B5563;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#374151" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="140.8926" x="563.06" y="830.0103">measure after correction</text></g><g class="caption" data-source-line="33"><text fill="#111827" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="610.1211" x="62.6225" y="959.7803">Conceptual evidence sequence. Values are source-reported; this is not an allocation-lifetime trace.</text></g><?plantuml-src TLLDRziu4BthLmoQIukr3CjAwiG55h0TgotQpM5R57lGXPP64jSKgUM7vQ3O_xv3IagTRMhuO7A6RzxCUwGjjmBXQw-WUUoKRT2WcO6bTQ6qni9o9KqKcIEN7TEiXGChZhLMJfOx9PI6gonyBZ9CmqhLSrb3nOJ1YyXuJ4lKa2mk0YLMp0cRAMaVM8lm0SK9BI_OopbZvIH9RfUhYvIDrgeVWzVRcvktwV-35wVJrNLoarooeswPh6aStoE0hT8bwkTW03zNfyoV9dARRR9Tz6yK_O1yzM4SBpUGvF9FRDK9WJRWzSCClhq1eMfk3RJCQdxEfLLWDUEIzcLDuogeC9wjUGNCG9F0rVrslydsbnLkPydTChRgY78uwoNGQ6XekSoSmHAOBC5OLHofZgwvP08wP4S3bcCkcOLbCa_lu3tVXZgqIztiTvlTvhBGHwC4inxEMfJU8T1fTI24JEcUwJBkX3EnTufV4GTMKEUGBEUh6mzEfOW8pQmtm0xAMKZdgpYTtvw9ZePIkOCWye53GFOiidItUiQYxGIsL9y51jHeHrOb4b-v86wPOARPF16i1cPX0XEnN7vXfsTj6093C0KJHBVdje47ECDz859vG9hxBjljLxzGTadLILBY_3V52RfqUg2dgY1stoX153jYG571d2mQA1elD1tt6KSk13Z9xQ3qyYMb__Zy5nZbT86X7u_cjHv5-4pI1WwbAuRHq37gnwj0nk0r-OaK84krBHsF3wwgWiFQTgmw0RwW_Nldf_ZZRSZbrfKrsW5zX8GHqg2_MHR5Oou_8NQXGSCgj8-Z0S4FmDChG-4weBymuo-XsrXZfxGDaxCUloVGN2xJsU9w0S7v1hpOGQhVeFAcp-LgTfU-lGW75k4MTC