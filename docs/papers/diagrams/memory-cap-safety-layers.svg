<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:1232px;height:681px;background:#FFFFFF;" width="1232px" height="681px" viewBox="0 0 1232 681" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.7beta8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="1"><text x="347.08" y="22.995" fill="#111827" font-size="14" textLength="531.829" font-weight="700" font-family="Helvetica">Three controls, and where an over-budget allocation actually stops</text></g><!--entity start--><g class="entity" data-qualified-name="start" id="ent0001" data-source-line="16"><rect x="471.878" y="44.297" width="214.817" height="52.594" fill="#EDE9FE" style="stroke:#4B5563;stroke-width:0.5;" rx="5" ry="5"/><text x="481.878" y="67.292" fill="#111827" font-size="14" textLength="194.817" font-family="Helvetica">Over-budget GPU allocation</text><text x="481.878" y="83.589" fill="#111827" font-size="14" textLength="136.466" font-family="Helvetica">on a 32 GB M1 Max</text></g><!--entity wired--><g class="entity" data-qualified-name="wired" id="ent0002" data-source-line="18"><rect x="387.928" y="157.897" width="382.722" height="68.891" fill="#FEF3C7" style="stroke:#4B5563;stroke-width:0.5;" rx="5" ry="5"/><text x="397.928" y="180.892" fill="#111827" font-size="14" textLength="131.161" font-family="Helvetica">mx.set_wired_limit</text><text x="397.928" y="197.189" fill="#111827" font-size="14" textLength="287.075" font-family="Helvetica">Residency cap on non-pageable memory</text><text x="397.928" y="213.486" fill="#111827" font-size="14" textLength="362.722" font-family="Helvetica">Bounds the wired set; does not reject the allocation</text></g><!--entity soft--><g class="entity" data-qualified-name="soft" id="ent0003" data-source-line="19"><rect x="356.888" y="303.787" width="444.792" height="68.891" fill="#FEF3C7" style="stroke:#4B5563;stroke-width:0.5;" rx="5" ry="5"/><text x="366.888" y="326.782" fill="#111827" font-size="14" textLength="151.061" font-family="Helvetica">mx.set_memory_limit</text><text x="366.888" y="343.079" fill="#111827" font-size="14" textLength="129.404" font-family="Helvetica">Advisory guideline</text><text x="366.888" y="359.376" fill="#111827" font-size="14" textLength="424.792" font-family="Helvetica">Does not stop evaluation; allocation may continue into swap</text></g><!--entity pageable--><g class="entity" data-qualified-name="pageable" id="ent0004" data-source-line="20"><rect x="416.938" y="449.677" width="324.698" height="52.594" fill="#FEF3C7" style="stroke:#4B5563;stroke-width:0.5;" rx="5" ry="5"/><text x="426.938" y="472.672" fill="#111827" font-size="14" textLength="296.823" font-family="Helvetica">Excess buffers stay unwired and pageable</text><text x="426.938" y="488.969" fill="#111827" font-size="14" textLength="304.698" font-family="Helvetica">Allocation continues toward RAM plus swap</text></g><!--entity panic--><g class="entity" data-qualified-name="panic" id="ent0005" data-source-line="22"><rect x="234.658" y="563.267" width="293.253" height="85.188" fill="#FECACA" style="stroke:#4B5563;stroke-width:0.5;" rx="5" ry="5"/><text x="244.658" y="586.262" fill="#111827" font-size="14" textLength="252.581" font-family="Helvetica">Before the fix: no process-local stop</text><text x="244.658" y="602.559" fill="#111827" font-size="14" textLength="238.294" font-family="Helvetica">Sustained pageable GPU pressure</text><text x="244.658" y="618.856" fill="#111827" font-size="14" textLength="273.253" font-family="Helvetica">Kernel panic at IOGPUMemory.cpp:550</text><text x="244.658" y="635.153" fill="#111827" font-size="14" textLength="178.896" font-family="Helvetica">(driver trigger unverified)</text></g><!--entity abort--><g class="entity" data-qualified-name="abort" id="ent0006" data-source-line="23"><rect x="563.238" y="563.267" width="428.092" height="85.188" fill="#DCFCE7" style="stroke:#4B5563;stroke-width:0.5;" rx="5" ry="5"/><text x="573.238" y="586.262" fill="#111827" font-size="14" textLength="271.489" font-family="Helvetica">After the fix: active-memory watchdog</text><text x="573.238" y="602.559" fill="#111827" font-size="14" textLength="408.092" font-family="Helvetica">Samples mx.get_active_memory() about twice per second</text><text x="573.238" y="618.856" fill="#111827" font-size="14" textLength="383.64" font-family="Helvetica">Crosses min(28.0 GiB static, available_at_start - 2 GiB)</text><text x="573.238" y="635.153" fill="#111827" font-size="14" textLength="338.263" font-family="Helvetica">Writes aborted_memory_ceiling, then hard-exits</text></g><!--link start to wired--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk7" data-source-line="25" data-link-type="dependency"><path d="M579.288,97.287 C579.288,114.877 579.288,133.387 579.288,152.507" style="stroke:#4B5563;stroke-width:1;" fill="none" id="start-to-wired"/><polygon points="579.288,157.507,583.288,148.507,579.288,152.507,575.288,148.507,579.288,157.507" fill="#4B5563" style="stroke:#4B5563;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link wired to soft--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" id="lnk8" data-source-line="26" data-link-type="dependency"><path d="M579.288,227.077 C579.288,250.167 579.288,275.657 579.288,298.707" style="stroke:#4B5563;stroke-width:1;" fill="none" id="wired-to-soft"/><polygon points="579.288,303.707,583.288,294.707,579.288,298.707,575.288,294.707,579.288,303.707" fill="#4B5563" style="stroke:#4B5563;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="580.288" y="269.854" fill="#374151" font-size="13" textLength="97.729" font-family="Helvetica">does not reject</text></g><!--link soft to pageable--><g class="link" data-entity-1="ent0003" data-entity-2="ent0004" id="lnk9" data-source-line="27" data-link-type="dependency"><path d="M579.288,373.137 C579.288,396.847 579.288,423.017 579.288,444.597" style="stroke:#4B5563;stroke-width:1;" fill="none" id="soft-to-pageable"/><polygon points="579.288,449.597,583.288,440.597,579.288,444.597,575.288,440.597,579.288,449.597" fill="#4B5563" style="stroke:#4B5563;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="580.288" y="415.744" fill="#374151" font-size="13" textLength="97.729" font-family="Helvetica">does not reject</text></g><!--link pageable to panic--><g class="link" data-entity-1="ent0004" data-entity-2="ent0005" id="lnk10" data-source-line="28" data-link-type="dependency"><path d="M539.688,502.547 C512.948,519.817 481.219,540.315 450.339,560.255" style="stroke:#4B5563;stroke-width:1;" fill="none" id="pageable-to-panic"/><polygon points="446.138,562.967,455.869,561.445,450.339,560.255,451.529,554.724,446.138,562.967" fill="#4B5563" style="stroke:#4B5563;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link pageable to abort--><g class="link" data-entity-1="ent0004" data-entity-2="ent0006" id="lnk11" data-source-line="29" data-link-type="dependency"><path d="M618.878,502.547 C645.628,519.817 677.348,540.315 708.228,560.255" style="stroke:#4B5563;stroke-width:1;" fill="none" id="pageable-to-abort"/><polygon points="712.428,562.967,707.037,554.724,708.228,560.255,702.698,561.445,712.428,562.967" fill="#4B5563" style="stroke:#4B5563;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><g class="caption" data-source-line="31"><text x="1" y="670.449" fill="#111827" font-size="14" textLength="1223.988" font-family="Helvetica">Layered view of the incident and its mitigation. The panic trigger is an unverified hypothesis; the watchdog is a best-effort process-local guard, not a hard machine boundary.</text></g><?plantuml-src RLHHRvim47xdLvoMbrOgKPCsQzTAan8QkcdBEdMRze8KEN20Lx2HRKAYQVzzPmCDRPeN0lVTtUVllhFXfa3ucIj4YAKmIXRw39X8eCbH8Vq3kKNbR-eaGmEiA6JC39S2M6ngUjs3DhBIdgUVkAYOOYLiMFoKALcB9925L30AtM-0q3bBPCD51Ya