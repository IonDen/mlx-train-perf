<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="792px" preserveAspectRatio="none" style="width:776px;height:792px;background:#FFFFFF;" version="1.1" viewBox="0 0 776 792" width="776px" zoomAndPan="magnify"><?plantuml 1.2026.6?><defs/><g><g class="title" data-source-line="1"><text fill="#111827" font-family="Helvetica" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="245.8203" x="261.9029" y="20.7803">After each fix, look again for the limit</text></g><!--entity logits--><g class="entity" data-qualified-name="logits" data-source-line="16" id="ent0001"><rect fill="#DBEAFE" height="62" rx="5" ry="5" style="stroke:#4B5563;stroke-width:0.5;" width="214.4961" x="50.58" y="42"/><text fill="#111827" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="98.0342" x="60.58" y="62.7803">First hypothesis</text><text fill="#111827" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="194.4961" x="60.58" y="76.7803">Remove the (N, V) logits matrix</text><text fill="#111827" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="141.6338" x="60.58" y="90.7803">to train longer contexts</text></g><!--entity attn--><g class="entity" data-qualified-name="attn" data-source-line="17" id="ent0002"><rect fill="#FECACA" height="62" rx="5" ry="5" style="stroke:#4B5563;stroke-width:0.5;" width="301.6475" x="7" y="179"/><text fill="#111827" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="259.9365" x="17" y="199.7803">Attention is the credible shared bottleneck</text><text fill="#111827" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="232.7021" x="17" y="213.7803">MLX ran attention unfused in training;</text><text fill="#111827" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="281.6475" x="17" y="227.7803">its backward materializes the full score matrix</text></g><!--entity flash--><g class="entity" data-qualified-name="flash" data-source-line="18" id="ent0003"><rect fill="#DCFCE7" height="62" rx="5" ry="5" style="stroke:#4B5563;stroke-width:0.5;" width="285.3574" x="15.15" y="316"/><text fill="#111827" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="45.1035" x="25.15" y="336.7803">First fix</text><text fill="#111827" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="265.3574" x="25.15" y="350.7803">Tiled FlashAttention forward and backward</text><text fill="#111827" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="242.7852" x="25.15" y="364.7803">Saved attention state scales with N x D</text></g><!--entity guard--><g class="entity" data-qualified-name="guard" data-source-line="19" id="ent0004"><rect fill="#FECACA" height="62" rx="5" ry="5" style="stroke:#4B5563;stroke-width:0.5;" width="306.3506" x="449.65" y="316"/><text fill="#111827" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="221.7783" x="459.65" y="336.7803">The limit moves to the launch guard</text><text fill="#111827" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="256.0674" x="459.65" y="350.7803">The guard budgets a whole launch chain;</text><text fill="#111827" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="286.3506" x="459.65" y="364.7803">MLX commits large ranges in separate buffers</text></g><!--entity perbuf--><g class="entity" data-qualified-name="perbuf" data-source-line="20" id="ent0005"><rect fill="#DCFCE7" height="62" rx="5" ry="5" style="stroke:#4B5563;stroke-width:0.5;" width="237.1504" x="484.25" y="453"/><text fill="#111827" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="65.3721" x="494.25" y="473.7803">Second fix</text><text fill="#111827" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="183.668" x="494.25" y="487.7803">Budget each command buffer</text><text fill="#111827" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="217.1504" x="494.25" y="501.7803">Keep the safety margin unchanged</text></g><!--entity upstream--><g class="entity" data-qualified-name="upstream" data-source-line="21" id="ent0006"><rect fill="#FEF3C7" height="62" rx="5" ry="5" style="stroke:#4B5563;stroke-width:0.5;" width="304.8193" x="450.41" y="590"/><text fill="#111827" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="154.8408" x="460.41" y="610.7803">Upstream moves it again</text><text fill="#111827" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="284.8193" x="460.41" y="624.7803">A later MLX release adds a blocked backward</text><text fill="#111827" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="189.0684" x="460.41" y="638.7803">for calls without an array mask</text></g><!--entity next--><g class="entity" data-qualified-name="next" data-source-line="22" id="ent0007"><rect fill="#EDE9FE" height="48" rx="5" ry="5" style="stroke:#4B5563;stroke-width:0.5;" width="248.792" x="478.43" y="713"/><text fill="#111827" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="105.8135" x="488.43" y="733.7803">After every move</text><text fill="#111827" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="228.792" x="488.43" y="747.7803">Look again at what now sets the limit</text></g><!--link logits to attn--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" data-link-type="dependency" data-source-line="24" id="lnk8"><path d="M157.82,104.3 C157.82,126.53 157.82,151.59 157.82,173.8" fill="none" id="logits-to-attn" style="stroke:#4B5563;stroke-width:1;"/><polygon fill="#4B5563" points="157.82,178.8,161.82,169.8,157.82,173.8,153.82,169.8,157.82,178.8" style="stroke:#4B5563;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#374151" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="171.2788" x="158.82" y="145.0103">no demonstrated context gain</text></g><!--link attn to flash--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" data-link-type="dependency" data-source-line="25" id="lnk9"><path d="M157.82,241.3 C157.82,263.53 157.82,288.59 157.82,310.8" fill="none" id="attn-to-flash" style="stroke:#4B5563;stroke-width:1;"/><polygon fill="#4B5563" points="157.82,315.8,161.82,306.8,157.82,310.8,153.82,306.8,157.82,315.8" style="stroke:#4B5563;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#374151" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="151.7344" x="158.82" y="282.0103">remove the quadratic term</text></g><!--link flash to guard--><g class="link" data-entity-1="ent0003" data-entity-2="ent0004" data-link-type="dependency" data-source-line="26" id="lnk10"><path d="M300.77,347 C348.17,347 396.11,347 444.28,347" fill="none" id="flash-to-guard" style="stroke:#4B5563;stroke-width:1;"/><polygon fill="#4B5563" points="449.28,347,440.28,343,444.28,347,440.28,351,449.28,347" style="stroke:#4B5563;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#374151" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="113.439" x="318.58" y="340.0103">exposes a new limit</text></g><!--link guard to perbuf--><g class="link" data-entity-1="ent0004" data-entity-2="ent0005" data-link-type="dependency" data-source-line="27" id="lnk11"><path d="M602.82,378.3 C602.82,400.53 602.82,425.59 602.82,447.8" fill="none" id="guard-to-perbuf" style="stroke:#4B5563;stroke-width:1;"/><polygon fill="#4B5563" points="602.82,452.8,606.82,443.8,602.82,447.8,598.82,443.8,602.82,452.8" style="stroke:#4B5563;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#374151" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="100.4326" x="603.82" y="419.0103">correct the model</text></g><!--link perbuf to upstream--><g class="link" data-entity-1="ent0005" data-entity-2="ent0006" data-link-type="dependency" data-source-line="28" id="lnk12"><path d="M602.82,515.3 C602.82,537.53 602.82,562.59 602.82,584.8" fill="none" id="perbuf-to-upstream" style="stroke:#4B5563;stroke-width:1;"/><polygon fill="#4B5563" points="602.82,589.8,606.82,580.8,602.82,584.8,598.82,580.8,602.82,589.8" style="stroke:#4B5563;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#374151" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="156.8062" x="603.82" y="556.0103">the framework changes too</text></g><!--link upstream to next--><g class="link" data-entity-1="ent0006" data-entity-2="ent0007" data-link-type="dependency" data-source-line="29" id="lnk13"><path d="M602.82,652.25 C602.82,671.25 602.82,690.37 602.82,707.84" fill="none" id="upstream-to-next" style="stroke:#4B5563;stroke-width:1;"/><polygon fill="#4B5563" points="602.82,712.84,606.82,703.84,602.82,707.84,598.82,703.84,602.82,712.84" style="stroke:#4B5563;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><g class="caption" data-source-line="31"><text fill="#111827" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="553.3281" x="108.149" y="780.7803">Conceptual sequence. It holds no measured values and is not an allocation-lifetime trace.</text></g><?plantuml-src RLHDZzis4BthLmoobnR85dKtsqqTe83NQw55qpqaQT63BsDf916cI8UaR6-A_lSyahAjTDS7myOCttlpvYEee8KMJH17mbL7ZJg-9ctjbhXbPQYnZa8df5MlGb7uhJ8xTjpJXgjjw-nWwgNLIBegqsUIuJkkxK6PbXhMNYQHyPapO9tzE0dKql2WGsbDUEHUw3VHUmcgufTpHkRPRFRsfxj9oi8vUnY3R-vlRt---NzmylhcxitiTZPL9rLWqyANVmkYU-jgST-24JrdH-OpHzwMYt9P_5SK5yXNfN8-KFUqix3LAxys7wItUqakV_Vuclx-7lwtAdZgEJXrN9jWARZO36rD2yigaCin-5V4_fHxzN2_MfIhATCY1351MKFA9_JAIQqs2A4p-4aR6z1z8zLsRVvy_myvDiJdHuDf1eyiy2PsDFBTsaIksFe3kpeA5ATOgo-I6Pf1Q_ALTJAAJnA1QU36QhbOBfvRqSGIFoaDgbApxowoCNk9XarzvboRZxn7waMd3r01KjOGSL2XeqSwqaDYRY8Wl5cMozNTbFhJQQGfUW_nDayv3mPBq0w9AIQbdxGPw