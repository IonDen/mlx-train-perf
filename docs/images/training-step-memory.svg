<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 392" width="720" height="392" role="img" aria-label="Peak memory of one training step on Qwen3-8B-4bit QLoRA (LoRA rank 8, batch 1, gradient checkpointing, bf16), flash attention on both arms, measured on mlx 0.32.0, with the fused loss against mlx-lm's stock loss. At 2,048 tokens: 7.08 against 7.80 GiB. At 8,192 tokens: 12.75 against 15.92 GiB. At 10,240 tokens: 14.80 against 18.76 GiB. At 12,288 tokens: 16.85 against 21.61 GiB.">
  <rect x="0" y="0" width="720" height="392" fill="#ffffff" rx="6"/>
  <style>
    .t  { font: 600 16px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #0f172a; }
    .s  { font: 400 12.5px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #475569; }
    .l  { font: 500 13px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #0f172a; }
    .v  { font: 600 13px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #0f172a; }
    .ax { font: 400 11px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #64748b; }
    .cap{ font: 400 11.5px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #64748b; }
  </style>

  <text class="t" x="24" y="30">One training step, Qwen3-8B-4bit QLoRA</text>
  <text class="s" x="24" y="50">Peak memory, LoRA rank 8, batch 1, gradient checkpointing, bf16, flash attention on both arms</text>

  <!-- legend -->
  <rect x="170" y="64" width="11" height="11" fill="#0d9488" rx="2"/>
  <text class="cap" x="187" y="74">fused loss</text>
  <rect x="270" y="64" width="11" height="11" fill="#64748b" rx="2"/>
  <text class="cap" x="287" y="74">mlx-lm's stock loss</text>

  <!-- gridlines: 18.8 px per GiB from x=170 -->
  <line x1="264" y1="86" x2="264" y2="316" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="358" y1="86" x2="358" y2="316" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="452" y1="86" x2="452" y2="316" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="546" y1="86" x2="546" y2="316" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="640" y1="86" x2="640" y2="316" stroke="#e2e8f0" stroke-width="1"/>

  <!-- 2,048 tokens -->
  <text class="l" x="160" y="116" text-anchor="end">2,048 tokens</text>
  <rect class="bar" data-seq="2048" data-arm="fused" x="170" y="92" width="133.2" height="18" fill="#0d9488" rx="2"/>
  <text class="v" data-seq="2048" data-arm="fused" x="309.2" y="105.5">7.08 GiB</text>
  <rect class="bar" data-seq="2048" data-arm="stock" x="170" y="114" width="146.7" height="18" fill="#64748b" rx="2"/>
  <text class="v" data-seq="2048" data-arm="stock" x="322.7" y="127.5">7.80 GiB</text>

  <!-- 8,192 tokens -->
  <text class="l" x="160" y="174" text-anchor="end">8,192 tokens</text>
  <rect class="bar" data-seq="8192" data-arm="fused" x="170" y="150" width="239.6" height="18" fill="#0d9488" rx="2"/>
  <text class="v" data-seq="8192" data-arm="fused" x="415.6" y="163.5">12.75 GiB</text>
  <rect class="bar" data-seq="8192" data-arm="stock" x="170" y="172" width="299.2" height="18" fill="#64748b" rx="2"/>
  <text class="v" data-seq="8192" data-arm="stock" x="475.2" y="185.5">15.92 GiB</text>

  <!-- 10,240 tokens -->
  <text class="l" x="160" y="232" text-anchor="end">10,240 tokens</text>
  <rect class="bar" data-seq="10240" data-arm="fused" x="170" y="208" width="278.3" height="18" fill="#0d9488" rx="2"/>
  <text class="v" data-seq="10240" data-arm="fused" x="454.3" y="221.5">14.80 GiB</text>
  <rect class="bar" data-seq="10240" data-arm="stock" x="170" y="230" width="352.7" height="18" fill="#64748b" rx="2"/>
  <text class="v" data-seq="10240" data-arm="stock" x="528.7" y="243.5">18.76 GiB</text>

  <!-- 12,288 tokens -->
  <text class="l" x="160" y="290" text-anchor="end">12,288 tokens</text>
  <rect class="bar" data-seq="12288" data-arm="fused" x="170" y="266" width="316.8" height="18" fill="#0d9488" rx="2"/>
  <text class="v" data-seq="12288" data-arm="fused" x="492.8" y="279.5">16.85 GiB</text>
  <rect class="bar" data-seq="12288" data-arm="stock" x="170" y="288" width="406.2" height="18" fill="#64748b" rx="2"/>
  <text class="v" data-seq="12288" data-arm="stock" x="582.2" y="301.5">21.61 GiB</text>

  <!-- axis -->
  <line x1="170" y1="316" x2="640" y2="316" stroke="#cbd5e1" stroke-width="1"/>
  <text class="ax" x="170" y="332" text-anchor="middle">0</text>
  <text class="ax" x="264" y="332" text-anchor="middle">5</text>
  <text class="ax" x="358" y="332" text-anchor="middle">10</text>
  <text class="ax" x="452" y="332" text-anchor="middle">15</text>
  <text class="ax" x="546" y="332" text-anchor="middle">20</text>
  <text class="ax" x="640" y="332" text-anchor="middle">25 GiB</text>

  <text class="cap" x="24" y="360">Records: _artifacts/bench_train_step_flash/ (macOS 26.5.1) and _artifacts/calib_050/ (macOS 26.5.2),</text>
  <text class="cap" x="24" y="376">mlx 0.32.0, one M1 Max 32 GB; measured with development checkouts of the package.</text>
</svg>
